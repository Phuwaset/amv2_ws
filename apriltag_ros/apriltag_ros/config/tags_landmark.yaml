# ## Tag bundle definitions
# ### Remarks
#
# - name is optional
# - x, y, z have default values of 0 thus they are optional
# - qw has default value of 1 and qx, qy, qz have default values of 0 thus they are optional
#
# ### Syntax
#
# tag_bundles:
#   [
#     {
#       name: 'CUSTOM_BUNDLE_NAME',
#       layout:
#         [
#           {id: ID, size: SIZE, x: X_POS, y: Y_POS, z: Z_POS, qw: QUAT_W_VAL, qx: QUAT_X_VAL, qy: QUAT_Y_VAL, qz: QUAT_Z_VAL},
#           ...
#         ]
#     },
#     ...
#   ]

tag_bundles:
  [
    {
      name: 'qr_landmark',
      layout:
        [
          {id: 0, size: 0.16, x: 1.048091259365582, y: 0.07055352415132542, z: 0.02878315555815903, qw: 0.711594933055918, qx: 0.008520157290771792, qy: -0.006916921116102014, qz: -0.7025042171417158},
          {id: 0, size: 0.16, x: 2.048091259365582, y: 1.07055352415132542, z: 0.02878315555815903, qw: 0.711594933055918, qx: 0.008520157290771792, qy: -0.006916921116102014, qz: -0.7025042171417158},
        ]
    },
  ]
