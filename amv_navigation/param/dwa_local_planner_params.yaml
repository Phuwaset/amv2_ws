DWAPlannerROS:

# Robot configuration
  max_vel_x:  0.27
  min_vel_x: 0.0

  max_vel_y: 0.0  # diff drive robot
  min_vel_y: 0.0  # diff drive robot

  max_vel_trans: 0.3  # choose slightly less than the base's capability
  min_vel_trans: 0.0  # this is the min trans velocity when there is negligible rotational velocity
  trans_stopped_vel: 0.01

  # Warning!
  #   do not set min_trans_vel to 0.0 otherwise dwa will always think translational velocities
  #   are non-negligible and small in place rotational velocities will be created.

  max_vel_theta: 0.3  # choose slightly less than the base's capability
  min_vel_theta: -0.3  # this is the min angular velocity when there is negligible translational velocity
  #rot_stopped_vel: 0.1
  theta_stopped_vel: 0.1

  acc_lim_x: 10.0
  acc_lim_y: 0.0      # diff drive robot
  acc_lim_trans: 10.0
  acc_lim_theta: 3.0

# Goal Tolerance Parameters
  xy_goal_tolerance: 0.20 #0.15
  yaw_goal_tolerance: 0.05 #0.02
  latch_xy_goal_tolerance: true

# Forward Simulation Parameters
  sim_time: 2.5
  vx_samples: 20
  vy_samples: 0
  vth_samples: 30
  controller_frequency: 10.0

# Trajectory Scoring Parameters
  path_distance_bias: 30    #30
  goal_distance_bias: 30     #25
  occdist_scale: 0.0
  forward_point_distance: 0.225  #0.325
  stop_time_buffer: 2.0
  scaling_speed: 0.1
  max_scaling_factor: 0.1

# Oscillation Prevention Parameters
  oscillation_reset_dist: 0.01

# Debugging
  publish_traj_pc : true
  publish_cost_grid_pc: true