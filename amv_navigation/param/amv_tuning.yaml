# ================================================================
# AMV2 TRACK TUNING - กลุ่มพารามิเตอร์สำหรับ DWA เกาะเส้น /planned_path
# แก้ค่าในไฟล์นี้ => restart service (หรือ move_base) เพื่อให้มีผล
# ค่าทั้งหมด = ค่าเดิมที่ใช้งานอยู่ (แก้ได้อย่างปลอดภัย ทีละกลุ่ม)
# ================================================================

# ----------------------------------------------------------------
# A. ความเร็วและอัตราเร่ง (Soft Start / ชะลอ / ความเร็วสูงสุด)
# ----------------------------------------------------------------
DWAPlannerROS:
  max_vel_x: 0.27            # ความเร็วเดินหน้า สูงสุด (m/s)  -> เพิ่ม = วิ่งเร็วขึ้น
  min_vel_x: 0.0             # ความเร็วเดินหน้า ต่ำสุด (m/s)  -> 0 = หยุดนิ่งได้
  max_vel_trans: 0.3         # ความเร็วรวม (trans) สูงสุด (m/s)
  min_vel_trans: 0.0         # ความเร็วรวม ต่ำสุด -> 0 = หยุดนิ่งได้
  acc_lim_x: 10.0            # อัตราเร่ง/หน่วง แกน x (m/s^2)  -> ลด = soft start นุ่มขึ้น / เบรกนุ่มขึ้น
  acc_lim_trans: 10.0        # อัตราเร่งรวม (m/s^2) -> ลด = นุ่มขึ้น
  acc_lim_theta: 3.0         # อัตราเร่งมุม (rad/s^2) -> ลด = หมุนนุ่มขึ้น

# ----------------------------------------------------------------
# B. เกาะเส้น /planned_path (Global Plan ที่ป้อนให้ DWA)
# ----------------------------------------------------------------
  path_distance_bias: 30.0   # คะแนน "ตามเส้นให้ตรง" -> เพิ่ม = เกาะเส้นแน่น (ห้ามออกนอกเลน)
  goal_distance_bias: 30.0   # คะแนน "วิ่งเข้าหาเป้าหมาย" -> เพิ่ม = มุ่งเป้าตรง (ลด = เดินตามเส้นมากกว่า)
  forward_point_distance: 0.325  # จุดอ้างอิงข้างหน้า (m) -> เพิ่ม = เลี้ยวกว้าง/ตัดโค้งนุ่ม, ลด = เลี้ยวคม
  sim_time: 2.5              # ระยะเวลาจำลองวิถี (s) -> เพิ่ม = มองไกลขึ้น (ช้าลง/เลี่ยงรอบก้อน)
  controller_frequency: 10.0 # ความถี่คำนวณความเร็ว (Hz) -> ลด = ประหยัด CPU แต่ตอบสนองช้าลง

# ----------------------------------------------------------------
# C. โค้ง / เลี้ยว (ความเร็วเชิงมุม + ความละเอียดการสุ่มวิถี)
# ----------------------------------------------------------------
  max_vel_theta: 0.3         # ความเร็วหมุน สูงสุด (rad/s) -> ลด = เลี้ยวช้าลง/นุ่ม
  min_vel_theta: -0.3        # ความเร็วหมุน ต่ำสุด (ติดลบ = หมุนกลับได้) (rad/s)
  vth_samples: 30            # จำนวนวิถีที่สุ่มทางมุม -> เพิ่ม = แม่นขึ้น (CPU มากขึ้น)
  vx_samples: 20             # จำนวนวิถีที่สุ่มความเร็วตรง -> เพิ่ม = แม่นขึ้น
  scaling_speed: 0.1         # ความเร็วที่เริ่มลดมุมเลี้ยว (m/s)
  max_scaling_factor: 0.1    # ตัวคูณลดมุมเลี้ยวที่ความเร็วสูง

# ----------------------------------------------------------------
# D. เข้าจอด / หมุน 90-180 / หยุด (Goal Tolerance)
# ----------------------------------------------------------------
  xy_goal_tolerance: 0.20    # รัศมีถือว่า "ถึงเป้า" (m) -> ลด = จอดแม่น (เสี่ยงสั่น/วน)
  yaw_goal_tolerance: 0.05   # มุมถือว่า "หันหน้าเข้าเป้า" (rad) -> ลด = หมุนแม่น (เสี่ยงสั่น)
  latch_xy_goal_tolerance: true  # จอดแล้วไม่ขยับซ้ำ (true) -> แนะนำ true
  trans_stopped_vel: 0.01    # ความเร็วตรงที่ถือว่า "หยุดแล้ว" (m/s)
  theta_stopped_vel: 0.1     # ความเร็วมุมที่ถือว่า "หยุดหมุนแล้ว" (rad/s)
  stop_time_buffer: 2.0      # เวลารอให้หยุดสนิทก่อนจบ (s)

# ----------------------------------------------------------------
# E. Global Planner / /planned_path (PlannedPathPlanner)
# ----------------------------------------------------------------
planner_frequency: 5.0       # ความถี่วางแผนใหม่ (Hz) -> เพิ่ม = ตอบสนองเส้นใหม่เร็ว
planner_patience: 5.0        # รอ planner ได้นานสุด (s) ก่อน error
controller_patience: 15.0    # รอ controller ได้นานสุด (s) ก่อน error
planned_path_max_match_dist: 1.0  # ระยะหา "จุดใกล้สุด" บน /planned_path (m) -> เพิ่ม = ยอมรับ start/goal ห่างเส้นมากขึ้น

# ----------------------------------------------------------------
# F. Costmap (รัศมีขยายสิ่งกีดขวางบนแผนที่ - ใช้กับ static map)
# ----------------------------------------------------------------
global_costmap:
  inflation_radius: 0.60      # รัศมีขยายรอบสิ่งกีดขวางใน global (m) -> เพิ่ม = ห่างกำแพงมากขึ้น
  cost_scaling_factor: 2.5   # ความชันการลด cost ตามระยะ -> ลด = cost ลดช้า (ออกห่างมาก)
local_costmap:
  inflation_radius: 0.65      # รัศมีขยายรอบสิ่งกีดขวางใน local (m) -> เพิ่ม = เลี่ยงไกลขึ้น
  cost_scaling_factor: 2.5   # ความชันการลด cost ใน local
